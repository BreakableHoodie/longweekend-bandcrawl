  /api/admin/bands/bulk:
    post:
      tags:
        - Admin - Bands
      summary: Add existing band profiles to an event lineup
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAddRequest"
      responses:
        "200":
          description: Bulk add response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags:
        - Admin - Bands
      summary: Bulk update performances (change_time, move_venue, or delete)
      description: >
        Applies a bulk action to a set of performances. For `change_time` and
        `move_venue`, scheduling conflicts are checked **before** any write. If
        conflicts are found and `ignore_conflicts` is not `true`, the request is
        rejected with **409** and no changes are applied. Pass
        `ignore_conflicts: true` to force the apply despite conflicts. The
        `delete` action has no conflict check.
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPatchRequest"
      responses:
        "200":
          description: Bulk operation applied successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Scheduling conflicts detected; no changes were applied. Re-submit
            with `ignore_conflicts: true` to force the apply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: conflicts
                  conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkConflict"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Admin - Bands
      summary: Bulk delete performances or profile-only rows
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteRequest"
      responses:
        "200":
          description: Bulk delete response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

