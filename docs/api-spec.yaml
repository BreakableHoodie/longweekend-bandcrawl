openapi: 3.0.3
info:
  title: SetTimes API
  version: "2026-06"
  description: |
    Live API contract for the current Cloudflare Pages + D1 implementation.

    Highlights:
    - Public schedule, discovery, band, feed, subscription, and telemetry endpoints
    - Invite-based admin signup with session cookies, CSRF protection, and optional TOTP MFA
    - Role-based admin routes for events, venues, bands, performers, users, invites, analytics, and maintenance
  contact:
    name: SetTimes
  license:
    name: AGPL-3.0-only

servers:
  - url: https://settimes.ca
    description: Production
  - url: http://localhost:8788
    description: Local Pages development

tags:
  - name: Public
    description: Public schedule, discovery, band, feed, and telemetry endpoints
  - name: Public - Subscriptions
    description: Email subscription lifecycle endpoints
  - name: Public - Auth
    description: Activation and password-reset endpoints
  - name: Admin - Auth
    description: Invite-based signup, login, MFA handoff, and logout
  - name: Admin - Session
    description: Session, trusted-device, and identity endpoints
  - name: Admin - MFA
    description: Authenticated MFA self-service endpoints
  - name: Admin - Events
    description: Event management endpoints
  - name: Admin - Bands
    description: Performance, roster-assignment, and media endpoints
  - name: Admin - Venues
    description: Venue management endpoints
  - name: Admin - Users
    description: User administration endpoints
  - name: Admin - Invites
    description: Invite-code management endpoints
  - name: Admin - Analytics
    description: Audit and analytics endpoints
  - name: Admin - Maintenance
    description: Administrative maintenance endpoints

paths:
  /api/artists/shuffle:
    get:
      tags:
        - Public
      summary: Five random artists from the public roster
      description: |
        Returns five randomly chosen artists who have performed at a published or
        archived event, for the roster showcase on `/artists`. Gated by
        `PUBLIC_DATA_PUBLISH_ENABLED`.

        Sends `Cache-Control: no-store` rather than the shared browse tier: a
        300-second cache would serve every visitor the same five artists for
        five minutes, which is a shuffle that does not shuffle.
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            How many artists to return. Clamped to 1-20; a value outside that
            range is clamped rather than rejected. A non-integer is a 400.
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Randomly selected artists
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    slug:
                      type: string
                    genre:
                      type: string
                      nullable: true
                    origin_city:
                      type: string
                      nullable: true
                    origin_region:
                      type: string
                      nullable: true
                    listen_url:
                      type: string
                      nullable: true
                      description: First of bandcamp, spotify or apple_music, else null
        "400":
          description: '`limit` was not an integer'
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          description: Server error

  /api/artists/one-of-one:
    get:
      tags:
        - Public
      summary: Genres belonging to exactly one artist
      description: |
        Returns genres represented by a single artist across published or
        archived events -- the "one of one" showcase. Gated by
        `PUBLIC_DATA_PUBLISH_ENABLED`.
      responses:
        "200":
          description: Genre tags held by exactly one artist, with that artist
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tag:
                      type: string
                      description: The genre tag, in its original casing
                    artist:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        genre:
                          type: string
                          nullable: true
                        origin_city:
                          type: string
                          nullable: true
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          description: Server error

  /api/bands/{name}/stage-mates:
    get:
      tags:
        - Public
      summary: Artists who have shared a bill with this artist
      description: |
        Co-performers on the same events, most-shared first, capped at 20.

        The path segment is spelled `{name}` because three sibling routes
        (`follow`, `unfollow`, `confirm-follow`) already bind that parameter and
        Cloudflare Pages cannot host `[name]/` and `[id]/` at one level. The
        VALUE callers send is the canonical `band_profiles.id`; a slug is also
        accepted.

        On a staged-reveal event (`reveal_mode = 1`) both sides of the join must
        be announced, so an unannounced booking is never disclosed. Gated by
        `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: name
          in: path
          required: true
          description: Canonical `band_profiles.id`, or the artist's slug
          schema:
            type: string
      responses:
        "200":
          description: Co-performers, ordered by shared event count
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    shared_events:
                      type: integer
        "400":
          description: Band identifier missing
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "404":
          description: No such artist
        "500":
          description: Server error

  /api/artists:
    get:
      tags:
        - Public
      summary: List/search the public artist directory
      description: |
        Returns artists (`band_profiles`) that have performed at one or more
        published or archived events, as `{ artists, hasMore }`. Searchable by
        name/genre and paginated. Gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: q
          in: query
          required: false
          description: Search term matched against artist name and genre
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 60
        - name: offset
          in: query
          required: false
          description: Number of results to skip
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Artist directory page
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        photo_url:
                          type: string
                          nullable: true
                        photo_alt_text:
                          type: string
                          nullable: true
                        genre:
                          type: string
                          nullable: true
                        origin:
                          type: string
                          nullable: true
                        performance_count:
                          type: integer
                        social:
                          allOf:
                            - $ref: "#/components/schemas/GenericRecord"
                          nullable: true
                          description: >-
                            Sanitized social_links map (safeReflectSocialLinks:
                            each value a normalized http(s) URL, an Instagram
                            handle, or null when the stored value was unsafe or
                            invalid). {} when the stored JSON was malformed;
                            null when no links are set. Consumers should still
                            sanitize before rendering (defense in depth).
                  hasMore:
                    type: boolean
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/venues:
    get:
      tags:
        - Public
      summary: List/search the public venue directory
      description: |
        Venues that have hosted one or more performances at a published or
        archived event, as `{ venues, hasMore }`. Searchable by name/city and
        paginated. Gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: q
          in: query
          required: false
          description: Search term matched against venue name and city
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 60
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Venue directory page
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        location:
                          type: string
                          nullable: true
                        performance_count:
                          type: integer
                        event_count:
                          type: integer
                  hasMore:
                    type: boolean
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/venues/{id}:
    get:
      tags:
        - Public
      summary: Get a venue with its lineup
      description: |
        Returns a venue plus its upcoming and past performances at published or
        archived events. Gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: id
          in: path
          required: true
          description: Venue id
          schema:
            type: integer
      responses:
        "200":
          description: Venue detail with lineup
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    type: object
                  upcoming:
                    type: array
                    items:
                      type: object
                  past:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid venue id
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/stats/public:
    get:
      tags:
        - Public
      summary: Privacy-safe aggregate platform stats
      description: |
        Aggregate-only counts, sums, and a top-N-by-popularity band list for the
        public stats page (social proof for the Vol-17 push). Never returns any
        individual/PII/joinable-to-a-person data: `fans_following` is a
        `COUNT(*) WHERE verified = 1` over `band_follows` (no emails, tokens, or
        IPs are ever selected), and `routes_shared`/`route_views` are a
        `COUNT`/`SUM(view_count)` over `share_links` (no slugs, band names, or
        performance IDs). Gated by `PUBLIC_DATA_PUBLISH_ENABLED`. Cached 5 minutes.
      responses:
        "200":
          description: Aggregate platform stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  bands:
                    type: integer
                    description: Count of active band profiles
                  venues:
                    type: integer
                    description: Count of venues
                  events:
                    type: integer
                    description: Count of published events
                  performances:
                    type: integer
                    description: Count of performances belonging to published events
                  routes_shared:
                    type: integer
                    description: Count of share_links rows (schedules shared)
                  route_views:
                    type: integer
                    description: Sum of share_links.view_count
                  fans_following:
                    type: integer
                    description: Count of verified band_follows rows
                  page_views:
                    type: integer
                    description: Sum of page_views_daily.views
                  top_bands:
                    type: array
                    maxItems: 8
                    description: Top bands by popularity_score (falls back to alphabetical order pre-event, when all scores are zero)
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
                          description: URL-safe band-name slug for display; the frontend builds its own band-page link from `name`
                        score:
                          type: integer
                          description: Rounded popularity_score
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/schedule:
    get:
      tags:
        - Public
      summary: Get the current or named public schedule
      description: |
        Returns the public schedule as `{ event, bands }`.
        This route is gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: event
          in: query
          required: false
          description: Event slug or `current`
          schema:
            type: string
            default: current
      responses:
        "200":
          description: Public schedule response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/events/public:
    get:
      tags:
        - Public
      summary: List public events
      description: Public event discovery endpoint gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: genre
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: upcoming
          in: query
          required: false
          description: When omitted or true, only current and upcoming published events are returned.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Public events response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventsResponse"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/events/timeline:
    get:
      tags:
        - Public
      summary: Get grouped event timeline
      description: Timeline response grouped into `now`, `upcoming`, and `past` buckets.
      parameters:
        - name: now
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: upcoming
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: past
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: includeBands
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: pastLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Timeline response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/events/{id}/details:
    get:
      tags:
        - Public
      summary: Get public event details
      description: Returns one published or archived event with band and venue detail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/events/{id}/recap:
    get:
      tags:
        - Public
      summary: Get recap stats and lineup for an archived event
      description: |
        Returns `{ event, stats, bands }` for a single **archived** event.
        `{id}` may be a numeric event ID or a slug. `stats` aggregates
        `total_sets`, `venue_count`, `first_timers`, and `returning_acts`;
        each band carries an `is_returning` flag. Gated by
        `PUBLIC_DATA_PUBLISH_ENABLED`. Cacheable (`max-age=3600`).
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric event ID or slug
          schema:
            type: string
      responses:
        "200":
          description: Event recap response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRecapResponse"
        "404":
          description: Event not found or not archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/bands/{name}:
    get:
      tags:
        - Public
      summary: Get public band profile
      description: |
        Returns a public band profile and published performance history.
        `{name}` may be a numeric band ID or a normalized band name.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Band profile response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBandProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/bands/stats/{name}:
    get:
      tags:
        - Public
      summary: Get public band profile with aggregate stats
      description: Extended public band endpoint gated by `PUBLIC_DATA_PUBLISH_ENABLED`.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Band stats response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBandStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/bands/{name}/follow:
    post:
      tags:
        - Public
      summary: Follow a band (double opt-in)
      description: |
        Registers an email to be notified when the band joins a lineup. The
        follow is created **unverified** and only a confirmation email is sent;
        announcement emails reach verified followers only. Bot-protected by
        Turnstile (`turnstileToken` in the body). `{name}` may be a numeric band
        ID or a normalized band name. Always responds `200` for a valid request
        regardless of whether the email already follows (no enumeration).
        `confirmUrl` is returned only when email delivery is not configured
        (local/dev) so the follow can still be confirmed.
      parameters:
        - name: name
          in: path
          required: true
          description: Numeric band ID or normalized band name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BandFollowRequest"
      responses:
        "200":
          description: Follow accepted (confirmation email sent if new)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BandFollowResponse"
        "400":
          description: Invalid email or failed bot verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/bands/{name}/confirm-follow:
    get:
      tags:
        - Public
      summary: Confirm a pending band follow
      description: |
        Verifies a double opt-in band follow via its one-time `token` and
        renders a friendly HTML page. Idempotent: a second click changes
        nothing. Messaging is generic so the response never reveals whether a
        given token was valid.
      parameters:
        - name: name
          in: path
          required: true
          description: Numeric band ID or normalized band name
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: One-time verification token from the confirmation email
          schema:
            type: string
      responses:
        "200":
          description: HTML confirmation page (valid, already-used, or expired)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Missing or malformed token
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Server error
          content:
            text/plain:
              schema:
                type: string

  /api/bands/{name}/unfollow:
    get:
      tags:
        - Public
      summary: Unsubscribe from a band's emails
      description: |
        Deletes the band follow tied to the `token` (the unsubscribe token from
        an email footer) and renders an HTML confirmation page. Returns `200`
        whether or not the token existed (no enumeration).
      parameters:
        - name: name
          in: path
          required: true
          description: Numeric band ID or normalized band name
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: Unsubscribe token
          schema:
            type: string
      responses:
        "200":
          description: HTML unsubscribe confirmation page
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Missing or malformed token
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Server error
          content:
            text/plain:
              schema:
                type: string

  /api/bands/follow-batch:
    post:
      tags:
        - Public
      summary: Batch follow bands (double opt-in)
      description: |
        Registers an email to be notified when any of the given bands joins a
        lineup. `performance_ids` is resolved to distinct `band_profile_ids`;
        one `band_follows` row per band is inserted (`verified=0`,
        `INSERT OR IGNORE`). All rows share a single `batch_token` so that
        **exactly one** combined confirmation email is sent — one Turnstile
        solve → one email, regardless of how many bands are in the batch
        (amplification mitigation). A confirmed address receives announcement
        emails only after clicking the confirm link (`verify=1`). Always
        returns `200` for valid input (no enumeration of existing follows).
        `confirmUrl` is returned only when email delivery is unconfigured
        (local/dev).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BandFollowBatchRequest"
      responses:
        "200":
          description: Batch accepted (one confirmation email sent if any follow was new)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BandFollowResponse"
        "400":
          description: Invalid email, failed bot verification, or invalid performance_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/bands/confirm-follow-batch:
    get:
      tags:
        - Public
      summary: Confirm a pending batch band follow
      description: |
        Verifies all pending (`verified=0`) `band_follows` rows that share the
        given `batch_token`, setting `verified=1` and clearing the token in one
        statement. Idempotent: a second click finds no matching rows (token is
        `NULL` after the first confirm) and returns the same success page.
        Messaging is generic to avoid revealing whether the token was valid.
      parameters:
        - name: token
          in: query
          required: true
          description: Shared batch_token from the confirmation email link
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: HTML confirmation page (success or already-confirmed)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Missing or oversized token
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Server error
          content:
            text/plain:
              schema:
                type: string

  /api/feeds/ical:
    get:
      tags:
        - Public
      summary: Download the iCal feed
      description: Returns a public calendar feed filtered by city and genre.
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: genre
          in: query
          required: false
          schema:
            type: string
            default: all
      responses:
        "200":
          description: iCal response
          content:
            text/calendar:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/PublicDataUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/metrics:
    post:
      tags:
        - Public
      summary: Ingest privacy-safe metrics
      description: Accepts a batch of allow-listed analytics events and responds with `OK` even when the payload is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsBatchRequest"
      responses:
        "200":
          description: Metrics payload accepted or ignored
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /api/schedule/build:
    post:
      tags:
        - Public
      summary: Record a schedule-build event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBuildRequest"
      responses:
        "200":
          description: Schedule build recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/schedule/share:
    post:
      tags:
        - Public
      summary: Create a shareable schedule snapshot
      description: |
        Persists a selected lineup for a published or archived event and returns
        a short `slug` reachable at `/s/{slug}`. Snapshots expire after 30 days.
        `band_names` must be the same length as `performance_ids` (up to 50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleShareRequest"
      responses:
        "200":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShareCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/schedule/share/{slug}:
    get:
      tags:
        - Public
      summary: Fetch a shared schedule snapshot
      description: |
        Returns the stored snapshot for a share `slug` if the link is unexpired
        and its event is still published or archived. Increments a best-effort
        view counter unless `?import=1` (the re-fetch used when applying the
        snapshot, so it is not double-counted).
      parameters:
        - name: slug
          in: path
          required: true
          description: 1–16 alphanumeric share slug
          schema:
            type: string
        - name: import
          in: query
          required: false
          description: Set to `1` on the apply re-fetch to skip the view increment
          schema:
            type: string
      responses:
        "200":
          description: Share snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleShareResponse"
        "400":
          description: Invalid slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Share link not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

