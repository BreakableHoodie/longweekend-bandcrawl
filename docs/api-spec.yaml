      summary: Flush the pending band-announcement digest queue
      description: |
        Groups pending `band_announce_queue` entries by `(email, event)` and
        sends one digest email per fan per event, recording each successful send
        in the per-follower idempotency ledger so resend never double-sends.
        Call after a batch of announce toggles. Requires the `editor` role and a
        configured email provider (otherwise `400`).
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: Digest flushed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlushAnnounceDigestResponse"
        "400":
          description: Email provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/maintenance/cleanup-sessions:
    post:
      tags:
        - Admin - Maintenance
      summary: Run the retention cleanup job
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      responses:
        "200":
          description: Cleanup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupSessionsResponse"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session_token
      description: Deployed admin session cookie. Local Pages development uses `session_token`.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Echo the `csrf_token` cookie for authenticated POST, PUT, PATCH, and DELETE admin requests.
    AdminApiKey:
      type: http
      scheme: bearer
      description: >-
        Machine-to-machine alternative to the session cookie, for callers that cannot
        hold a browser session. Present the key issued by `POST /api/admin/api-keys` as
        `Authorization: Bearer st_...`.


        The key authorises at ITS OWN role, which may be lower than its creator's — a
        `viewer` key minted by an admin gets 403 from an admin-only route.


        CSRF is not required on this path and no `X-CSRF-Token` is expected: a bearer
        credential is not attached ambiently by a browser. Because of that, sending a
        key AND a session cookie on the same request is rejected outright with 400
        `AMBIGUOUS_AUTH` rather than one being preferred — neither credential is
        honoured. Requests are rate limited per key, independently of the per-IP
        limits, and a revoked or expired key stops working on the very next request
        with no cache window.

  parameters:
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed or no active session exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Request was blocked by RBAC, CSRF validation, or same-origin validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource state conflicts with the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PublicDataUnavailable:
      description: Public publishing is disabled for this route
      headers:
        Retry-After:
          schema:
            type: string
            example: "3600"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

