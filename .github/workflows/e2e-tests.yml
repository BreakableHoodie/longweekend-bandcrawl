name: E2E Tests

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        name: e2e
        runs-on: ubuntu-latest
        timeout-minutes: 35
        # Fork PRs cannot access repo secrets; credentials.js throws when ADMIN_PASSWORD is unset.
        # Skip the job for fork PRs — it still runs on push and same-repo PRs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Run affected tests (fast-path)
              id: affected
              uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
              with:
                  filters: |
                      frontend: 'frontend/**'
                      e2e: 'e2e/**'
                      functions: 'functions/**'
                      schema: |
                          migrations/**
                          database/**
                      ci: |
                          .github/actions/e2e-env/**
                          .github/workflows/e2e-tests.yml

            - name: E2E environment
              if: github.event_name == 'push' || steps.affected.outputs['frontend'] == 'true' || steps.affected.outputs['e2e'] == 'true' || steps.affected.outputs['functions'] == 'true' || steps.affected.outputs['schema'] == 'true' || steps.affected.outputs['ci'] == 'true'
              uses: ./.github/actions/e2e-env
              with:
                  e2e-admin-password: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  e2e-admin-email: ${{ secrets.E2E_ADMIN_EMAIL }}

            - name: Run Playwright tests
              if: github.event_name == 'push' || steps.affected.outputs['frontend'] == 'true' || steps.affected.outputs['e2e'] == 'true' || steps.affected.outputs['functions'] == 'true' || steps.affected.outputs['schema'] == 'true' || steps.affected.outputs['ci'] == 'true'
              env:
                  ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
                  ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
                  PLAYWRIGHT_SKIP_A11Y_VISUAL: 'true'
              run: npx playwright test --reporter=list,html

            # The server's own log, not the tests'. On 2026-09-09 fifty specs
            # failed with ERR_CONNECTION_REFUSED after the boot loop had
            # already reported "Server is ready" and the setup project had
            # passed -- so wrangler started, served, then stopped. The
            # Playwright report records fifty identical connection errors and
            # nothing about WHY the server went away, because /tmp/wrangler.log
            # was never collected. A red build with no diagnostic is the same
            # family as a green one that did not look.
            #
            # if-no-files-found: warn -- the log is absent when the
            # affected-paths filter skips the environment step entirely, which
            # is a legitimate no-op rather than a failure.
            - name: Upload wrangler server log
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: wrangler-log-e2e
                  path: /tmp/wrangler.log
                  if-no-files-found: warn
                  retention-days: 30

            - name: Upload Playwright report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: playwright-report-e2e
                  path: playwright-report/
                  retention-days: 30
