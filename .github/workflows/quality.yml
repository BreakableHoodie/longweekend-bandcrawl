name: Quality Checks

on:
  pull_request:
    branches: [main, dev]
    # Skip docs-only PRs — but docs/api-spec.yaml is the OpenAPI contract this
    # workflow's "OpenAPI Validation" job exists to check, so re-include it.
    # (paths patterns evaluate in order; the last matching pattern decides.)
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/api-spec.yaml"

permissions:
  contents: read

# These checks only run on PRs and focus on fast quality gates,
# including early OpenAPI drift detection before merge.

env:
  NODE_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        run: npm run validate:openapi

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

  format-check-backend:
    name: Format Check (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check backend code formatting
        run: npm run format:check

  lint-backend:
    name: ESLint (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

  mutation-gate:
    name: Mutation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # This job runs git (status/diff) and spawns vitest over repository
          # test code, but never pushes. checkout@v7 defaults this to true,
          # which writes the GITHUB_TOKEN into the runner's git credential
          # config -- an unnecessary credential to have present while
          # executing repo code. 19 other checkout steps in this repo have the
          # same default and are tracked separately; this is the one in scope
          # here.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      # Converts documented CLAUDE.md invariants into executable proof: applies
      # each mutation, asserts the named test(s) go red, restores, and verifies
      # the restore. Deliberately its own job/step rather than part of `make
      # gate` -- see scripts/mutation-gate.mjs's header and CLAUDE.md's
      # "Proactive Quality Gates" table for why `gate` must stay fast and
      # offline-capable while this one shells out to git and spawns vitest
      # once per mutation (~8s locally).
      - name: Run mutation gate
        run: node scripts/mutation-gate.mjs

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check setup-complete.sql matches migrations
        run: node scripts/check-schema-drift.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Backend coverage
        run: npm run test:coverage

      # MUST stay in this job, immediately after the coverage run: the gate
      # reads coverage/coverage-final.json, which only exists as a side effect
      # of the step above. It hard-fails when that file is absent rather than
      # skipping, so moving it to its own job would turn it into a permanent
      # red rather than a silent pass -- but a red for the wrong reason.
      #
      # Catches what a GLOBAL threshold structurally cannot: a brand-new
      # handler with no tests at all moves the average by a rounding error and
      # passes. On 2026-08-31 the backend sat at 81.67% against a 75% floor
      # while three files were at 0%.
      - name: Coverage floor (no handler at 0%)
        run: node scripts/check-coverage-floor.mjs

      # The other half of the same problem. The floor catches a file nobody
      # tested; this catches the THRESHOLD drifting so far below actual that a
      # double-digit regression would pass. That has happened twice, to ~10
      # points both times, because a ratchet re-tightened by hand decays while
      # nothing fails. Must run after the coverage step -- it reads the summary
      # that step produces.
      - name: Coverage drift (thresholds still near actual)
        run: node scripts/check-coverage-drift.mjs backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend coverage drift
        run: node scripts/check-coverage-drift.mjs frontend

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: npm run test:a11y

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Chrome installed
        working-directory: .
        run: google-chrome --version

      - name: Prepare E2E environment
        uses: ./.github/actions/e2e-env
        with:
          install-playwright: 'false'
          # Lighthouse only loads public pages and never authenticates, so this
          # job is deliberately not handed admin credentials.
          seed-admin: 'false'

      # Retries ONCE, and only when wrangler has vanished (#878 /
      # cloudflare/workers-sdk#14926). That upstream bug exits the dev server on a
      # RECOVERABLE runtime blip -- wrangler does not implement miniflare's
      # `unsafeHandleRuntimeRestart` hook -- so a gate failing on it is failing for
      # a reason unrelated to the PR. Measured: 5 occurrences in ~2 weeks, and a
      # plain re-run of the identical commit passes.
      #
      # A score regression must still fail. The discriminator is NOT the exit code
      # (identical either way) but the SERVER: after the abort there is no listener
      # and no process, whereas a failed assertion leaves it healthy.
      - name: Run Lighthouse CI
        working-directory: .
        run: |
          set -u

          run_lighthouse() { ( cd frontend && npm run lighthouse ); }

          # True only when BOTH signals agree the server is gone. Requiring both
          # keeps a merely-slow server (still listening) out of the retry path.
          server_gone() {
              listeners=$( { command -v ss >/dev/null && ss -H -lptn 'sport = :8788'; } 2>/dev/null \
                || netstat -lptn 2>/dev/null \
                  | grep -E '(^|[[:space:]])[^[:space:]]*:8788([[:space:]]|$)' || true )
              procs=$(pgrep -f 'wrangler|workerd' 2>/dev/null || true)
              [ -z "$listeners" ] && [ -z "$procs" ]
          }

          # Same invocation as .github/actions/e2e-env, enforced by
          # functions/__tests__/wranglerDevCommand.test.js -- drift there means the
          # retry would serve something different from the run it is retrying.
          restart_wrangler() {
              echo "  restarting wrangler..." >&2
              ./frontend/node_modules/.bin/wrangler pages dev frontend/dist --port 8788 --persist-to .wrangler/state > /tmp/wrangler-retry.log 2>&1 &
              i=1
              while [ $i -le 60 ]; do
                  if curl -sf -o /dev/null --max-time 2 http://localhost:8788/; then
                      echo "  server back after $((i * 2))s" >&2
                      return 0
                  fi
                  sleep 2
                  i=$((i + 1))
              done
              echo "  x server did not come back within 120s -- not retrying" >&2
              tail -50 /tmp/wrangler-retry.log >&2 || true
              return 1
          }

          code=0
          run_lighthouse || code=$?
          if [ "$code" -eq 0 ]; then exit 0; fi

          if ! server_gone; then
              echo "x Lighthouse failed with the server still up -- a real failure, not #878." >&2
              exit "$code"
          fi

          echo "x Lighthouse failed AND wrangler is gone: the #878 signature." >&2
          # Preserve the first run's log before the restart overwrites the picture,
          # so the diagnostics step still shows the abort that started this.
          cp /tmp/wrangler.log /tmp/wrangler-first-run.log 2>/dev/null || true
          restart_wrangler || exit "$code"

          echo "  retrying Lighthouse once..." >&2
          code=0
          run_lighthouse || code=$?
          if [ "$code" -eq 0 ]; then echo "+ passed on retry after a #878 abort" >&2; exit 0; fi

          # The retry ALSO failed. Ask the same discriminator again: if the server
          # is gone a second time, this is #878 twice over, not a score
          # regression -- the assertions never got to run against a live server.
          # Warn and pass rather than spend a human triage on a failure whose
          # cause is already known and is not in this PR.
          #
          # Observed 2026-08-25/26 on #961 and #964: wrangler died, the restart
          # succeeded in ~4s, and the retry hit CHROME_INTERSTITIAL_ERROR again.
          # Two of three PRs that day, both green on a manual re-run, and the job
          # is not a required check -- so its only effect was a red X that had to
          # be read to be dismissed. That is signal erosion: a check that is
          # usually-wrong trains you to wave past the time it is right.
          #
          # A real regression still fails, because it leaves the server HEALTHY
          # and takes the branch above. Do not replace this with
          # continue-on-error -- that would swallow score regressions too.
          if server_gone; then
              echo "::warning title=Lighthouse skipped::Lighthouse aborted twice with wrangler gone (#878). Scores were never measured against a live server, so this is not a score regression. See #925." >&2
              exit 0
          fi

          echo "x Lighthouse failed on retry with the server up -- a real failure." >&2
          exit "$code"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CI: true

      # The gate has failed with CHROME_INTERSTITIAL_ERROR mid-pass (#878): the
      # server serves two Lighthouse runs and is unreachable for the third.
      # wrangler's own output goes to /tmp/wrangler.log and was never surfaced,
      # so diagnosing it needed a local reproduction instead of just reading the
      # failure. Dump it — and say whether the process and port are still alive,
      # which distinguishes "crashed" from "wedged" and points at different fixes.
      - name: Wrangler diagnostics on failure
        if: failure()
        working-directory: .
        run: |
            # Dump log text WITHOUT letting the runner parse it as workflow
            # commands. A dumped line starting `::endgroup::` would close our
            # group early and strand the rest of the diagnostics inside no
            # group; `::error::` would forge an annotation. The `sed` indent
            # further down is cosmetic and cannot be relied on as protection.
            # The token must be unguessable from the log's own contents, so it
            # is generated per call rather than fixed.
            dump() {
              local tok
              tok="stop-$(date +%s%N)-${RANDOM}${RANDOM}"
              echo "::stop-commands::${tok}"
              # The resume marker MUST be emitted even if `cat` fails. While
              # commands are stopped, every later ::group::/::endgroup:: and
              # annotation in the JOB is inert -- so returning early here would
              # silently disable the rest of the diagnostics output, not just
              # this dump.
              cat || true
              echo "::${tok}::"
            }
            echo "::group::wrangler.log"
            if [ -f /tmp/wrangler.log ]; then tail -200 /tmp/wrangler.log | dump || true; else echo "(no /tmp/wrangler.log)"; fi
            echo "::endgroup::"
            echo "::group::wrangler internal log"
            # When wrangler aborts (#878) it prints an [ERROR] with an EMPTY
            # body to stdout, then names a log file it wrote the real detail
            # to. Run 32295262333 captured exactly that: the banner, the
            # "please file a bug" link, ~9 more successful requests, and then
            # the process gone -- with the one field that explains it blank.
            # /tmp/wrangler.log above is only our stdout redirect, so it has
            # the same blank. This is the file that does not.
            log=$(find "$HOME/.config/.wrangler/logs" -maxdepth 1 -type f -name '*.log' \
                    -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "$log" ]; then
              echo "  file: $log"
              # Both pipelines are best-effort: the step runs under `bash -e`,
              # and a diagnostic that aborts the step would take the liveness
              # and resource probes with it -- losing the evidence it exists to
              # collect, on the one run where it matters.
              tail -200 "$log" 2>/dev/null | sed 's/^/  /' | dump || true
            else
              echo "  (no log under $HOME/.config/.wrangler/logs)"
            fi
            echo "::endgroup::"
            echo "::group::server liveness"
            echo "listeners on :8788:"
            # Capture, then decide. `ss` exits 0 with EMPTY output when nothing
            # is listening, so an `|| echo none` chain prints nothing at all --
            # and "no listener" is precisely the crashed-vs-wedged signal this
            # step exists to report. Silence would be the wrong answer here.
            # -H suppresses ss's header. Without it a no-listener result is a
            # header row with zero entries -- non-empty, so it printed as though
            # something WAS listening. Observed in run 32266757116.
            # netstat's grep is field-bounded so ':8788' cannot match ':87880'.
            listeners=$( { command -v ss >/dev/null && ss -H -lptn 'sport = :8788'; } 2>/dev/null \
              || netstat -lptn 2>/dev/null \
                | grep -E '(^|[[:space:]])[^[:space:]]*:8788([[:space:]]|$)' || true )
            if [ -n "$listeners" ]; then printf '%s\n' "$listeners"; else echo "  none"; fi
            echo "wrangler/workerd processes:"
            pgrep -a -f 'wrangler|workerd' || echo "  none running"
            echo "HTTP probe:"
            # Bounded deliberately: the case this step exists to catch is a
            # server that accepts the connection and never answers. An unbounded
            # probe would hang there until the 15-minute job timeout and could
            # cost the artifact upload -- the diagnostic making the failure worse.
            curl --connect-timeout 2 --max-time 5 -sS -o /dev/null \
              -w '  status=%{http_code} time=%{time_total}s\n' http://localhost:8788/ || echo "  no response within 5s"
            echo "::endgroup::"
            # Three occurrences of #878 have now shown the same shape -- two clean
            # Lighthouse runs, then a silent abort mid-asset-serving on the third,
            # process gone and the port refused in ~0.2ms. That is an abort, not a
            # hang, but the two candidate causes (kernel OOM kill vs a workerd
            # crash) are indistinguishable from what this step captures today.
            # These probes are what tells them apart. wrangler 4.124.0 did NOT
            # fix it, so the version hypothesis is spent.
            echo "::group::resources"
            echo "memory:"
            # Capture, then decide -- `free | sed || echo` takes the PIPELINE's
            # status, which is sed's success, so the fallback never fires and the
            # section prints nothing at all. Same trap as the listener check above.
            mem=$(free -m 2>/dev/null || true)
            if [ -n "$mem" ]; then printf '%s\n' "$mem" | sed 's/^/  /'; else echo "  (free unavailable)"; fi
            echo "load average:"
            # Capture before deciding, as every probe in this block does: `sed`
            # exits 0 on a file that exists but is EMPTY, so a `|| echo` fallback
            # would never fire and the section would print blank -- the one output
            # a diagnostic must never produce.
            load=$(sed 's/^/  /' /proc/loadavg 2>/dev/null || true)
            if [ -n "$load" ]; then printf '%s\n' "$load"; else echo "  (unavailable)"; fi
            echo "kernel OOM kills (the question three runs have failed to answer):"
            # dmesg is often restricted to root on hosted runners; sudo -n so a
            # missing grant fails immediately instead of prompting and hanging.
            oom=$( { sudo -n dmesg 2>/dev/null || dmesg 2>/dev/null; } \
              | grep -iE 'out of memory|oom[-_]kill|killed process' | tail -20 || true )
            if [ -n "$oom" ]; then printf '%s\n' "$oom" | sed 's/^/  /'; else echo "  none found (or dmesg not readable)"; fi
            echo "::endgroup::"

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci
          # REQUIRED: `.lighthouseci` is a dot-directory, and upload-artifact
          # treats "files within folders beginning with ." as hidden and skips
          # them by default. Without this the step uploaded NOTHING while only
          # emitting a warning -- "No files were found with the provided path"
          # -- so every LHR was silently lost for as long as it has been here.
          # That matters most on the failure path this artifact exists to serve:
          # when the perf or CLS gate goes red there was no report to open.
          include-hidden-files: true
          # An empty upload must now be loud. The whole point of this artifact is
          # post-mortem on a failed run, and a warning nobody reads is how it
          # stayed broken.
          if-no-files-found: error
          retention-days: 30
