<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>(function(){var t;try{t=localStorage.getItem('settimes-theme')}catch{}if(!t||!['midnight-ember','arctic-night','daybreak','silver-lining'].includes(t))t='midnight-ember';document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m){var c={0:'#0c0f1a',1:'#0f172a',2:'#fffbeb',3:'#f8fafc'}[['midnight-ember','arctic-night','daybreak','silver-lining'].indexOf(t)];if(c)m.setAttribute('content',c)}})()</script>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0c0f1a" />

    <!-- SEO -->
    <meta name="description" content="Discover upcoming live music events and build your personalized show schedule. Browse artists, venues, and set times all in one place." />
    <meta property="og:site_name" content="SetTimes" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://settimes.ca/" />
    <meta property="og:title" content="SetTimes – Live Music Events & Show Schedules" />
    <meta property="og:description" content="Discover upcoming live music events and build your personalized show schedule. Browse artists, venues, and set times all in one place." />
    <meta property="og:image" content="https://settimes.ca/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SetTimes – Live Music Events & Show Schedules" />
    <meta name="twitter:description" content="Discover upcoming live music events and build your personalized show schedule." />
    <meta name="twitter:image" content="https://settimes.ca/og-default.png" />

    <!-- Site-wide structured data (JSON-LD data blocks — not executable, so no CSP hash needed).
         Lives in the SPA shell so every route carries Organization + WebSite; SSR routes
         (event/band/venue) add their own MusicEvent/MusicGroup/MusicVenue on top. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SetTimes",
        "url": "https://settimes.ca",
        "logo": "https://settimes.ca/apple-touch-icon.png",
        "email": "hello@settimes.ca",
        "areaServed": "Waterloo Region, Ontario",
        "description": "A free, community-run live-music event-schedule tool for Waterloo Region, Ontario."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SetTimes",
        "url": "https://settimes.ca"
      }
    </script>

    <!-- Favicon: ICO first for Safari desktop fallback, then SVG for modern browsers, then PNGs -->
    <link rel="icon" href="/favicon.ico" sizes="32x32 16x16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>SetTimes – Live Music Events & Show Schedules</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      A crawlable link graph, and the no-JS entry point (#1159).

      Measured 2026-09-10: every public route returned ZERO <a> tags in raw
      HTML. serveWithInjectedMeta() injects into <head> only, so the body stays
      an empty #root until JS runs. Pages still got indexed -- Googlebot
      renders -- but every link-derived signal was absent, and Search Console
      confirmed it: an indexed page's sole referring URL was sitemap.xml. The
      sitemap was the entire discovery channel for the site.

      Inside <noscript> on purpose. These links are parsed in the raw-HTML pass
      before any render, so they are discovered exactly when link signals are
      cheapest -- and they never duplicate the app's own nav for a JS visitor,
      which a plain <div> here would, since React only replaces #root.

      It also stops being a dead end without JS: someone with scripting off now
      gets real navigation rather than a blank page.

      Only static, parameterless routes belong here. Every href must be a real
      <Route path> in src/main.jsx -- note /events is NOT one, the event list
      lives at /. A guard test enforces that; see
      src/__tests__/crawlableLinks.test.js.
    -->
    <noscript>
      <nav aria-label="Site">
        <ul>
          <li><a href="/">Upcoming shows</a></li>
          <li><a href="/artists">Artists</a></li>
          <li><a href="/venues">Venues</a></li>
          <li><a href="/stats">Stats</a></li>
          <li><a href="/subscribe">Get show announcements</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </nav>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
